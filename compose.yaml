services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: panis360
      POSTGRES_USER: panis360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - panis360-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panis360 -d panis360"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  panis360-db:
