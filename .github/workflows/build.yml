name: Compilar e verificar
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Panis360.sln
      - run: dotnet build Panis360.sln --no-restore --configuration Release
      - run: dotnet run --project tests/Panis360.Tests --configuration Release --no-build
